name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: product
          persist-credentials: false
      - name: Checkout SRIC Core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository_owner }}/sric-core
          path: sric-core
          token: ${{ secrets.SRIC_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ./sric-core
          python -m pip install -e './product[dev]'
      - name: Quality and tests
        run: |
          python -m ruff check product/src product/tests
          MYPYPATH="$PWD/sric-core/src:$PWD/product/src" python -m mypy --strict product/src
          python -m compileall -q product/src
          PYTHONPATH="$PWD/sric-core/src:$PWD/product/src" python -m pytest -q product/tests
      - name: Security baseline
        run: python product/scripts/security-scan.py
      - name: Dependency audit
        run: |
          python -m pip install 'pip-audit>=2,<3'
          python -m pip_audit
      - name: Build
        run: python -m build product
